[workspace]
members = [
    "crates/osmena-core",
    "crates/osmena-engine",
    "crates/osmena-chrome",
    "crates/osmena-shell",
    "tools/osmena-xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasmost/osmena"

[workspace.dependencies]
osmena-core = { path = "crates/osmena-core", version = "0.1.0" }
osmena-engine = { path = "crates/osmena-engine", version = "0.1.0" }
osmena-chrome = { path = "crates/osmena-chrome", version = "0.1.0" }
# winit, egui, and glow share one GL context and raw window handles with
# the engines, so they are pinned to exact versions and bumped together;
# a browser that depends on osmena resolves to the same versions. The pins
# are the ones Servo 0.7.0's own shell uses (Paladin's constraint).
winit = "=0.30.13"
egui = "=0.34.3"
# `clipboard`: the address bar copies and pastes through the system
# clipboard (without it egui-winit keeps a private one).
egui-winit = { version = "=0.34.3", default-features = false, features = ["clipboard"] }
egui_glow = { version = "=0.34.3", features = ["winit"] }
glow = "=0.17.0"
glutin = "0.32"
raw-window-handle = "0.6"
dpi = "0.1"
keyboard-types = { version = "0.8.3", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
