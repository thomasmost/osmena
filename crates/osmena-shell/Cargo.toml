[package]
name = "osmena-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The osmena browser shell: the winit application, browser windows and settings window over any Engine"

[dependencies]
osmena-core = { workspace = true }
osmena-engine = { workspace = true }
osmena-chrome = { workspace = true }
# "Copy link address" and "Copy image" from the page's context menu.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
clap = { version = "4", features = ["derive"] }
dpi = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
glow = { workspace = true }
keyboard-types = { workspace = true }
log = { workspace = true }
url = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)`: whether another browser still has a profile open
# (profiles.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The job object that ties an engine's child processes to the browser
# (process.rs), and whether a process is still running (profiles.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES, gated behind this feature.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
