[package]
name = "osmena-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared `cargo xtask` tasks for osmena browsers: icon generation"

[dependencies]
# default-features = false drops text and system-font support, so the
# output never depends on fonts installed on the machine. A logo must
# therefore contain no <text> elements. raster-images lets an SVG place
# PNG artwork it frames (Paladin's logo).
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
icns = "0.5.0"
ico = "0.6.0"
